name: Windows UI Hotfix 0.3.1

on:
  push:
    branches:
      - fix/windows-ui-0.3.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xtmusic-windows-ui-hotfix-0.3.1
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run application checks and tests
        run: npm run build

      - name: Verify packaged renderer assets
        run: node scripts/verify-renderer-assets.js

      - name: Capture Windows UI proof
        run: npx electron scripts/windows-ui-snapshot.js

      - name: Build Windows installer and portable package
        run: npm run dist:win

      - name: Verify package outputs and generate checksums
        shell: pwsh
        run: |
          $installer = Get-Item 'release/XT-Music-0.3.1-x64.exe'
          $portable = Get-Item 'release/XT-Music-Portable-0.3.1-x64.exe'
          if ($installer.Length -lt 50000000) { throw "Installer is unexpectedly small: $($installer.Length)" }
          if ($portable.Length -lt 50000000) { throw "Portable package is unexpectedly small: $($portable.Length)" }
          Get-FileHash $installer.FullName, $portable.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content 'release/SHA256SUMS-Windows.txt'
          Get-Content 'release/SHA256SUMS-Windows.txt'
          Get-Content 'ui-proof/windows-ui-metrics.json'

      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Windows-UI-Hotfix-0.3.1
          path: |
            release/XT-Music-0.3.1-x64.exe
            release/XT-Music-Portable-0.3.1-x64.exe
            release/SHA256SUMS-Windows.txt
            ui-proof/renderer-assets.json
            ui-proof/windows-ui-metrics.json
            ui-proof/windows-ui-snapshot.png
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.3.1 Windows UI hotfix
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          name: XT Music v0.3.1 — Windows UI Hotfix
          target_commitish: ${{ github.sha }}
          body_path: releases/v0.3.1.md
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release/XT-Music-0.3.1-x64.exe
            release/XT-Music-Portable-0.3.1-x64.exe
            release/SHA256SUMS-Windows.txt
            ui-proof/renderer-assets.json
            ui-proof/windows-ui-metrics.json
            ui-proof/windows-ui-snapshot.png
