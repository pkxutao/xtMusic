name: Windows Playback Regression

on:
  push:
    branches: [master, main]
    paths:
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/windows-playback-regression.yml'
  pull_request:
    branches: [master]
    paths:
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/windows-playback-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback-regression:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run application, protocol and playback tests
        run: npm run build

      - name: Verify packaged renderer assets
        run: node scripts/verify-renderer-assets.js

      - name: Capture Windows UI proof
        run: npx electron scripts/windows-ui-snapshot.js

      - name: Exercise real Chromium media loading through loopback proxy
        run: npx electron scripts/windows-media-smoke.js

      - name: Exercise delayed login, 5000 playlists and 2000-song queue
        run: npx electron scripts/windows-post-login-smoke.js

      - name: Build Windows installer and portable package
        run: npm run dist:win

      - name: Verify package outputs
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = Get-Item "release/XT-Music-$version-x64.exe"
          $portable = Get-Item "release/XT-Music-Portable-$version-x64.exe"
          if ($installer.Length -lt 50000000) { throw "Installer is unexpectedly small: $($installer.Length)" }
          if ($portable.Length -lt 50000000) { throw "Portable package is unexpectedly small: $($portable.Length)" }
          if (-not (Test-Path 'ui-proof/windows-media-smoke.json')) { throw 'Missing media smoke proof' }
          if (-not (Test-Path 'ui-proof/windows-post-login-smoke.json')) { throw 'Missing post-login responsiveness proof' }
          Get-FileHash $installer.FullName, $portable.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content 'release/SHA256SUMS-Windows.txt'

      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Windows-Playback-Regression
          path: |
            release/*.exe
            release/SHA256SUMS-Windows.txt
            ui-proof/renderer-assets.json
            ui-proof/windows-ui-metrics.json
            ui-proof/windows-ui-snapshot.png
            ui-proof/windows-media-smoke.json
            ui-proof/windows-post-login-smoke.json
          if-no-files-found: error
          retention-days: 14
