name: Apply and Publish Windows Playback Hotfix 0.3.2

on:
  push:
    branches:
      - fix/windows-playback-0.3.2
    paths:
      - '.github/workflows/apply-playback-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xtmusic-apply-playback-hotfix-0.3.2
  cancel-in-progress: false

jobs:
  apply-build-publish:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct verified source patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find .playback-hotfix -maxdepth 1 -type f -name 'payload.*' | sort -V)
          printf 'Found %s payload parts\n' "${#PARTS[@]}"
          printf '  %s\n' "${PARTS[@]}"
          test "${#PARTS[@]}" -eq 8
          wc -c "${PARTS[@]}"
          cat "${PARTS[@]}" > /tmp/xtmusic-playback-hotfix.b64
          base64 --decode /tmp/xtmusic-playback-hotfix.b64 > /tmp/hotfix.tar.gz
          ACTUAL="$(sha256sum /tmp/hotfix.tar.gz | awk '{print $1}')"
          echo "archive_sha256=$ACTUAL"
          test "$ACTUAL" = "2026b835fe792dc624f631a4051ac723c77d281744842cdca4aa6c92086e7bae"
          tar -xzf /tmp/hotfix.tar.gz -C .

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/renderer/app.js';
          let source = fs.readFileSync(path, 'utf8');

          if (!source.includes('configureMediaBaseUrl,')) {
            const importPattern = /(import \{\r?\n\s*artistsText,\r?\n\s*attr,\r?\n)/;
            if (!importPattern.test(source)) {
              throw new Error('Unable to locate the renderer utility import block');
            }
            source = source.replace(importPattern, '$1  configureMediaBaseUrl,\n');
          }

          if (!source.includes('configureMediaBaseUrl(bootstrap.mediaBaseUrl);')) {
            const bootstrapPattern = /(\s+const bootstrap = await api\.bootstrap\(\);\r?\n)/;
            if (!bootstrapPattern.test(source)) {
              throw new Error('Unable to locate renderer bootstrap initialization');
            }
            source = source.replace(
              bootstrapPattern,
              '$1      configureMediaBaseUrl(bootstrap.mediaBaseUrl);\n'
            );
          }

          fs.writeFileSync(path, source, 'utf8');
          NODE

          cat > tests/playback-routing.test.js <<'EOF'
          'use strict';

          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.join(__dirname, '..');
          const read = (relative) => fs.readFileSync(path.join(root, relative), 'utf8');
          const index = read('src/main/index.js');
          const ipc = read('src/main/ipc.js');
          const preload = read('src/preload.js');
          const html = read('src/renderer/index.html');
          const utils = read('src/renderer/utils.js');
          const player = read('src/renderer/player.js');
          const app = read('src/renderer/app.js');

          test('desktop runtime starts a secure loopback media server and exposes only its random base URL', () => {
            assert.match(index, /new MediaServer\(\{ runtime, hlsRegistry \}\)/);
            assert.match(index, /await mediaServer\.start\(\)/);
            assert.match(ipc, /mediaBaseUrl: mediaServer\?\.baseUrl \|\| null/);
            assert.match(preload, /diagnostics: \(\) => invoke\('player:diagnostics'\)/);
            assert.doesNotMatch(ipc, /music-token/);
          });

          test('renderer permits only loopback HTTP media and configures it before rendering a session', () => {
            assert.match(html, /media-src[^;]*http:\/\/127\.0\.0\.1:\*/);
            assert.match(html, /connect-src[^;]*http:\/\/127\.0\.0\.1:\*/);
            assert.match(html, /img-src[^;]*http:\/\/127\.0\.0\.1:\*/);
            assert.match(utils, /parsed\.hostname !== '127\.0\.0\.1'/);
            assert.match(utils, /mediaResourceUrl\('stream', guid\)/);
            assert.match(app, /configureMediaBaseUrl,/);
            assert.match(app, /configureMediaBaseUrl\(bootstrap\.mediaBaseUrl\)/);
          });

          test('player probes the stream before playback and reports upstream failures precisely', () => {
            assert.match(player, /await probeMediaSource\(url\)/);
            assert.match(player, /Range: 'bytes=0-1'/);
            assert.match(player, /responseErrorMessage/);
            assert.match(player, /this\.diagnostics\?\.\(\)/);
            assert.match(index, /autoplay-policy/);
          });
          EOF

          rm -rf .playback-hotfix .github/workflows/apply-playback-hotfix.yml
          test "$(node -p "require('./package.json').version")" = "0.3.2"
          test -f src/main/media-server.js
          test -f scripts/windows-media-smoke.js
          test -f .github/workflows/windows-playback-hotfix.yml

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run application, protocol and playback tests
        run: npm run build

      - name: Verify packaged renderer assets
        run: node scripts/verify-renderer-assets.js

      - name: Capture Windows UI proof
        run: npx electron scripts/windows-ui-snapshot.js

      - name: Exercise real Chromium media loading through loopback proxy
        run: npx electron scripts/windows-media-smoke.js

      - name: Build Windows installer and portable package
        run: npm run dist:win

      - name: Verify package outputs and generate checksums
        shell: pwsh
        run: |
          $installer = Get-Item 'release/XT-Music-0.3.2-x64.exe'
          $portable = Get-Item 'release/XT-Music-Portable-0.3.2-x64.exe'
          if ($installer.Length -lt 50000000) { throw "Installer is unexpectedly small: $($installer.Length)" }
          if ($portable.Length -lt 50000000) { throw "Portable package is unexpectedly small: $($portable.Length)" }
          if (-not (Test-Path 'ui-proof/windows-media-smoke.json')) { throw 'Missing media smoke proof' }
          Get-FileHash $installer.FullName, $portable.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content 'release/SHA256SUMS-Windows.txt'
          Get-Content 'release/SHA256SUMS-Windows.txt'
          Get-Content 'ui-proof/windows-media-smoke.json'
          Get-Content 'ui-proof/windows-ui-metrics.json'

      - id: commit
        name: Commit real playback fix source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add package.json src tests scripts releases .github/workflows
          git status --short
          git commit -m 'fix: replace custom media scheme with secure loopback playback proxy'
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:fix/windows-playback-0.3.2

      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Windows-Playback-Hotfix-0.3.2
          path: |
            release/XT-Music-0.3.2-x64.exe
            release/XT-Music-Portable-0.3.2-x64.exe
            release/SHA256SUMS-Windows.txt
            ui-proof/renderer-assets.json
            ui-proof/windows-ui-metrics.json
            ui-proof/windows-ui-snapshot.png
            ui-proof/windows-media-smoke.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.3.2 Windows playback hotfix
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.2
          name: XT Music v0.3.2 — Windows Playback Hotfix
          target_commitish: ${{ steps.commit.outputs.sha }}
          body_path: releases/v0.3.2.md
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release/XT-Music-0.3.2-x64.exe
            release/XT-Music-Portable-0.3.2-x64.exe
            release/SHA256SUMS-Windows.txt
            ui-proof/renderer-assets.json
            ui-proof/windows-ui-metrics.json
            ui-proof/windows-ui-snapshot.png
            ui-proof/windows-media-smoke.json
