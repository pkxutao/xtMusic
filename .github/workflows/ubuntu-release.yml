name: Ubuntu Desktop Release

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/ubuntu-release.yml
      - scripts/ubuntu-package-smoke.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xtmusic-ubuntu-desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve the current desktop version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ubuntu-v$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p verification ui-proof release-out
          git rev-parse HEAD
      - name: Install Ubuntu build and virtual desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libfuse2 libgtk-3-0 libnss3 libasound2 libgbm1 \
            libxss1 libxtst6 libatk-bridge2.0-0 libsecret-1-0 \
            fonts-noto-cjk pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=xtmusic_ci
          pactl set-default-sink xtmusic_ci
      - name: Install locked dependencies and pinned Electron runtime
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          env -u ELECTRON_SKIP_BINARY_DOWNLOAD node node_modules/electron/install.js
          node -e "require('node:fs').accessSync(require('electron'), require('node:fs').constants.X_OK)"
      - name: Build renderer and run application tests
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee verification/application-tests.log
          node scripts/verify-renderer-assets.js 2>&1 | tee verification/renderer-assets.log
      - name: Run existing UI regressions on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          if test -f node_modules/electron/dist/chrome-sandbox; then
            sudo chown root:root node_modules/electron/dist/chrome-sandbox
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          fi
          for TEST in windows-large-library-smoke windows-now-playing-smoke windows-album-navigation-smoke windows-track-list-typography-smoke; do
            timeout 150s xvfb-run -a npx --no-install electron "scripts/$TEST.js" \
              2>&1 | tee "verification/${TEST/windows-/ubuntu-}.log"
          done
      - name: Build Ubuntu x64 DEB and AppImage
        run: |
          set -euo pipefail
          npx --no-install electron-builder --linux AppImage deb --x64 --publish never \
            2>&1 | tee verification/packaging.log
      - name: Inspect and install the exact DEB package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          DEB="release/XT-Music-${VERSION}-ubuntu-amd64.deb"
          APPIMAGE="release/XT-Music-${VERSION}-ubuntu-x86_64.AppImage"
          test -s "$DEB"
          test -s "$APPIMAGE"
          test "$(stat -c %s "$DEB")" -gt 50000000
          test "$(stat -c %s "$APPIMAGE")" -gt 50000000
          test "$(dpkg-deb -f "$DEB" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$DEB" Architecture)" = amd64
          file "$DEB" "$APPIMAGE" | tee verification/package-file-types.txt
          dpkg-deb --info "$DEB" | tee verification/deb-info.txt
          sudo apt-get install -y "$PWD/$DEB"
          dpkg-query -W xtmusic | tee verification/installed-package.txt
          node - "$VERSION" <<'NODE'
          const assert = require('node:assert/strict');
          const asar = require('@electron/asar');
          const pkg = JSON.parse(asar.extractFile('/opt/XT Music/resources/app.asar', 'package.json').toString());
          assert.equal(pkg.version, process.argv[2]);
          assert.equal(pkg.name, 'xtmusic');
          console.log('Installed ASAR identity verified:', pkg.name, pkg.version);
          NODE
      - name: Launch the installed DEB and extracted AppImage with sandbox enabled
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          timeout 100s xvfb-run -a node scripts/ubuntu-package-smoke.js \
            '/opt/XT Music/xtmusic' ubuntu-installed-deb "$VERSION"
          mkdir -p "$RUNNER_TEMP/xtmusic-appimage"
          APPIMAGE="$PWD/release/XT-Music-${VERSION}-ubuntu-x86_64.AppImage"
          chmod +x "$APPIMAGE"
          (cd "$RUNNER_TEMP/xtmusic-appimage" && "$APPIMAGE" --appimage-extract) \
            > verification/appimage-contents.txt
          APPDIR="$RUNNER_TEMP/xtmusic-appimage/squashfs-root"
          cmp '/opt/XT Music/resources/app.asar' "$APPDIR/resources/app.asar"
          if test -f "$APPDIR/chrome-sandbox"; then
            sudo chown root:root "$APPDIR/chrome-sandbox"
            sudo chmod 4755 "$APPDIR/chrome-sandbox"
          fi
          timeout 100s xvfb-run -a node scripts/ubuntu-package-smoke.js \
            "$APPDIR/AppRun" ubuntu-appimage-extracted "$VERSION"
      - name: Collect verified packages and build provenance
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cp "release/XT-Music-${VERSION}-ubuntu-amd64.deb" release-out/
          cp "release/XT-Music-${VERSION}-ubuntu-x86_64.AppImage" release-out/
          for PROOF in ui-proof/windows-*.json ui-proof/windows-*.png; do
            test -f "$PROOF" || continue
            NAME="$(basename "$PROOF")"
            cp "$PROOF" "release-out/ubuntu-${NAME#windows-}"
          done
          cp ui-proof/ubuntu-*.json ui-proof/ubuntu-*.png release-out/
          {
            echo "Product: XT Music Ubuntu Desktop"
            echo "Version: $VERSION"
            echo "Tag: $TAG"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Source commit: $GITHUB_SHA"
            echo "Source branch: $GITHUB_REF_NAME"
            echo "Build runner: Ubuntu 22.04 x86_64"
            echo "Architecture: amd64 / x64 (not ARM64)"
            echo "Runtime: Electron $(node -p "require('./package.json').devDependencies.electron")"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Built at: $(date -u +%FT%TZ)"
          } > release-out/BUILD-INFO-Ubuntu.txt
          {
            echo 'Application checks, syntax validation and Node unit tests: PASS'
            echo 'Renderer asset verification: PASS'
            echo 'Large-library responsiveness on Ubuntu/Xvfb: PASS'
            echo 'Now-playing and lyrics UI regression on Ubuntu/Xvfb: PASS'
            echo 'Artist and album navigation on Ubuntu/Xvfb: PASS'
            echo 'Song-list typography on Ubuntu/Xvfb: PASS'
            echo 'DEB and AppImage packaging: PASS'
            echo 'DEB version, architecture and installed ASAR identity: PASS'
            echo 'Installed DEB startup, preload and login screen: PASS'
            echo 'Extracted AppImage startup and identical ASAR payload: PASS'
            echo 'No --no-sandbox flag was used. A virtual display and null audio sink were used.'
            echo 'Not verified: live FNOS login/network playback, physical audio devices, Bluetooth, Wayland, or FUSE-mounted AppImage launch.'
          } > release-out/VERIFICATION-Ubuntu.txt
          cp verification/deb-info.txt release-out/DEB-INFO.txt
          (cd release-out && find . -maxdepth 1 -type f ! -name SHA256SUMS-Ubuntu.txt \
            -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS-Ubuntu.txt)
          (cd release-out && sha256sum -c SHA256SUMS-Ubuntu.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Ubuntu-${{ steps.meta.outputs.version }}-x64
          path: release-out/*
          if-no-files-found: error
          retention-days: 30
      - name: Preserve unverified packages only for failure diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Unverified-Packages-${{ github.run_id }}
          path: |
            release/*.deb
            release/*.AppImage
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
      - name: Upload test logs and screenshots even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-Verification-${{ github.run_id }}
          path: |
            verification/
            ui-proof/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: XT-Music-Ubuntu-${{ needs.build.outputs.version }}-x64
          path: release-out
      - name: Check integrity and refuse stale or duplicate publication
        shell: bash
        run: |
          set -euo pipefail
          (cd release-out && sha256sum -c SHA256SUMS-Ubuntu.txt)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$GITHUB_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $TAG"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Refusing to reuse existing tag $TAG"
            exit 1
          fi
      - name: Create a draft containing all verified assets
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # XT Music Ubuntu ${VERSION}

          从最新主分支 master 构建的 Ubuntu x64 桌面版，源码提交：${GITHUB_SHA}。
          使用当前桌面版的界面与功能；本次仅增加 Ubuntu 构建和验证，不改动桌面交互，也不把安卓留声机界面自动移植到桌面。

          ## 下载与安装
          - XT-Music-${VERSION}-ubuntu-amd64.deb：Ubuntu amd64 安装包。
          - XT-Music-${VERSION}-ubuntu-x86_64.AppImage：x86_64 便携包。
          - SHA256SUMS-Ubuntu.txt：安装包、截图和验证材料的完整性校验。
          - BUILD-INFO-Ubuntu.txt / VERIFICATION-Ubuntu.txt：源码、构建环境和测试范围。

          安装 DEB：sudo apt install ./XT-Music-${VERSION}-ubuntu-amd64.deb
          运行 AppImage：先 chmod +x XT-Music-${VERSION}-ubuntu-x86_64.AppImage，再运行该文件。
          不需要删除旧账号配置；升级前请正常退出旧客户端。

          ## 验证范围
          在 Ubuntu 22.04 x64 上完成锁定依赖构建、单元测试、渲染资源检查、大曲库/歌词/专辑跳转/列表字体 UI 回归，以及 DEB 实际安装和启动、AppImage 解包后的启动检查。
          保持应用沙箱启用；测试使用虚拟显示器与虚拟音频输出。
          未使用真实飞牛服务器账号，未验收物理声卡、蓝牙、Wayland 或 FUSE 挂载运行。

          这是独立的 Ubuntu 发布；不覆盖 Windows 或安卓已有 Release 和附件，也不修改 Windows 的 latest 标记。
          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$TAG" release-out/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "XT Music Ubuntu ${VERSION} (x64)" \
            --notes-file release-notes.md --draft --latest=false
      - name: Verify uploaded bytes before making the release public
        shell: bash
        run: |
          set -euo pipefail
          mkdir roundtrip
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir roundtrip
          cmp release-out/SHA256SUMS-Ubuntu.txt roundtrip/SHA256SUMS-Ubuntu.txt
          (cd roundtrip && sha256sum -c SHA256SUMS-Ubuntu.txt)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)" = "$GITHUB_SHA"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '{tag_name, target_commitish, draft, prerelease, html_url, assets: [.assets[] | {name, size, digest}]}'
