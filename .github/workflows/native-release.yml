name: Native Release

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xtmusic-native-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'publish/native-v'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' native/Cargo.toml | head -n1)"
          TAG="v${VERSION}"
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test -n "$VERSION"
          test -f "releases/${TAG}.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo build --release --locked --manifest-path native/Cargo.toml
      - shell: powershell
        run: choco install innosetup --no-progress -y
      - shell: powershell
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "native\installer\windows.iss"'
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-windows-${{ needs.prepare.outputs.version }}
          path: native/dist/*.exe
          if-no-files-found: error

  ubuntu:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libssl-dev fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo build --release --locked --manifest-path native/Cargo.toml
      - run: bash native/installer/package-linux.sh ${{ needs.prepare.outputs.version }} amd64
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-ubuntu-${{ needs.prepare.outputs.version }}
          path: |
            native/dist/*.deb
            native/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, windows, ubuntu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-release-*-${{ needs.prepare.outputs.version }}
          path: release
          merge-multiple: true
      - name: Generate release metadata
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          cat > release/BUILD-INFO.txt <<EOF
          Product: XT Music Native
          Version: ${VERSION}
          Tag: ${TAG}
          Commit: ${TARGET_SHA}
          Runtime: Rust + egui/eframe (no Electron, no Tauri, no WebView)
          Built by: GitHub Actions
          EOF
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: XT Music Native ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.target_sha }}
          body_path: releases/${{ needs.prepare.outputs.tag }}.md
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: |
            release/*.exe
            release/*.deb
            release/*.tar.gz
            release/BUILD-INFO.txt
            release/SHA256SUMS.txt
