name: Apply Now Playing Lyrics Hotfix 0.3.6

on:
  push:
    branches:
      - fix/now-playing-lyrics-0.3.6
    paths:
      - '.github/workflows/apply-now-playing-hotfix.yml'
      - 'scripts/apply-now-playing-hotfix.py'
      - 'scripts/windows-now-playing-smoke.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xtmusic-now-playing-lyrics-0.3.6
  cancel-in-progress: false

jobs:
  apply-test-package:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply now-playing and lyrics source changes
        run: python scripts/apply-now-playing-hotfix.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run application and regression tests
        run: npm run build

      - name: Verify renderer assets
        run: node scripts/verify-renderer-assets.js

      - name: Capture Windows UI proof
        run: npx electron scripts/windows-ui-snapshot.js

      - name: Exercise loopback playback
        run: npx electron scripts/windows-media-smoke.js

      - name: Exercise delayed login and long queue
        run: npx electron scripts/windows-post-login-smoke.js

      - name: Exercise real large-library pagination
        run: npx electron scripts/windows-large-library-smoke.js

      - name: Exercise now-playing and lyrics entry points
        run: npx electron scripts/windows-now-playing-smoke.js

      - name: Build Windows installer and portable package
        run: npm run dist:win

      - name: Verify packages and generate checksums
        shell: pwsh
        run: |
          $installer = Get-Item 'release/XT-Music-0.3.6-x64.exe'
          $portable = Get-Item 'release/XT-Music-Portable-0.3.6-x64.exe'
          if ($installer.Length -lt 50000000) { throw "Installer is unexpectedly small: $($installer.Length)" }
          if ($portable.Length -lt 50000000) { throw "Portable package is unexpectedly small: $($portable.Length)" }
          $proofs = @(
            'ui-proof/windows-ui-metrics.json',
            'ui-proof/windows-media-smoke.json',
            'ui-proof/windows-post-login-smoke.json',
            'ui-proof/windows-large-library-smoke.json',
            'ui-proof/windows-now-playing-smoke.json'
          )
          foreach ($proof in $proofs) {
            if (-not (Test-Path $proof)) { throw "Missing proof: $proof" }
          }
          Get-FileHash $installer.FullName, $portable.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content 'release/SHA256SUMS-Windows.txt'
          Get-Content 'release/SHA256SUMS-Windows.txt'
          Get-Content 'ui-proof/windows-now-playing-smoke.json'

      - name: Commit validated source hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch .github/workflows/apply-now-playing-hotfix.yml scripts/apply-now-playing-hotfix.py
          git add package.json package-lock.json
          git add src/renderer/app.js src/renderer/index.html src/renderer/lyrics-experience.js src/renderer/styles.css
          git add scripts/windows-post-login-preload.js scripts/windows-now-playing-smoke.js
          git add tests/now-playing-lyrics-regression.test.js
          git add ui-proof/windows-now-playing-smoke.json
          git status --short
          git commit -m 'fix: restore now-playing entry and deadlock-free lyrics'
          git push origin HEAD:fix/now-playing-lyrics-0.3.6

      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Windows-Now-Playing-0.3.6
          path: |
            release/XT-Music-0.3.6-x64.exe
            release/XT-Music-Portable-0.3.6-x64.exe
            release/SHA256SUMS-Windows.txt
            ui-proof/renderer-assets.json
            ui-proof/windows-ui-metrics.json
            ui-proof/windows-ui-snapshot.png
            ui-proof/windows-media-smoke.json
            ui-proof/windows-post-login-smoke.json
            ui-proof/windows-large-library-smoke.json
            ui-proof/windows-now-playing-smoke.json
          if-no-files-found: error
          retention-days: 30
