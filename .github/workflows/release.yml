name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xtmusic-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'publish/'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: meta
        name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $VERSION" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "$TAG" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version $TAG" >&2
            exit 1
          fi

          test -f "releases/${TAG}.md" || {
            echo "Missing release manifest: releases/${TAG}.md" >&2
            exit 1
          }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows packages
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ needs.prepare.outputs.version }}
          path: release/*.exe
          if-no-files-found: error

  build-ubuntu:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Ubuntu packages
        run: npm run dist:ubuntu

      - uses: actions/upload-artifact@v4
        with:
          name: release-ubuntu-${{ needs.prepare.outputs.version }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: [prepare, build-windows, build-ubuntu]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ needs.prepare.outputs.version }}
          path: release
          merge-multiple: true

      - id: notes
        name: Prepare release notes
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="releases/${TAG}.md"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Generate build information and checksums
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          cat > release/BUILD-INFO.txt <<EOF
          Product: XT Music
          Version: ${VERSION}
          Tag: ${TAG}
          Commit: ${TARGET_SHA}
          Built by: GitHub Actions
          EOF

          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: XT Music ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.target_sha }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/BUILD-INFO.txt
            release/SHA256SUMS.txt
