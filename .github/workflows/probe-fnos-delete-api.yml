name: Probe FNOS music delete API v3

on:
  push:
    branches:
      - chore/probe-fnos-delete-api

permissions:
  contents: write

concurrency:
  group: fnos-delete-api-probe-v3
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve FN routes and inspect music frontend assets
        run: python scripts/probe_fnos_delete_api_v3.py

      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-results/fnos-delete-api-probe-v3.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(probe): capture signed FN music frontend clues [skip ci]'
            git push origin HEAD:chore/probe-fnos-delete-api
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fnos-delete-api-probe-v3
          path: probe-results/fnos-delete-api-probe-v3.txt
          if-no-files-found: error
          retention-days: 7
