name: Probe FNOS music delete API v2

on:
  push:
    branches:
      - chore/probe-fnos-delete-api

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspect FN Connect route resolver and static modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import html
          import json
          import re
          import ssl
          import urllib.parse
          import urllib.request
          from collections import deque
          from pathlib import Path

          OUT = Path("probe-results")
          OUT.mkdir(exist_ok=True)
          RESULT = OUT / "fnos-delete-api-probe.txt"
          FN_ID = "pkxutao"
          ENTRY = f"https://{FN_ID}.fnos.net/music/"

          context = ssl.create_default_context()
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE
          opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=context),
              urllib.request.HTTPRedirectHandler(),
          )

          def fetch(url: str, max_bytes: int = 35 * 1024 * 1024) -> tuple[str, bytes, str]:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 XT-Music-CI-ReadOnly-Probe/4.0",
                      "Accept": "text/html,application/javascript,text/javascript,application/json,*/*;q=0.8",
                  },
              )
              with opener.open(request, timeout=30) as response:
                  return response.geturl(), response.read(max_bytes), response.headers.get("content-type", "")

          lines: list[str] = []
          def emit(*values: object) -> None:
              text = " ".join(str(value) for value in values)
              lines.append(text)
              print(text)

          final_entry, entry_body, entry_type = fetch(ENTRY)
          entry_text = entry_body.decode("utf-8", "ignore")
          emit("ENTRY", ENTRY, "->", final_entry, entry_type, len(entry_body))

          asset_urls: deque[str] = deque()
          seen: set[str] = set()
          documents: list[tuple[str, str]] = [(final_entry, entry_text)]

          def enqueue(base: str, raw: str) -> None:
              raw = html.unescape(str(raw or "").strip().strip('"\''))
              if not raw or raw.startswith(("data:", "blob:", "javascript:")):
                  return
              absolute = urllib.parse.urljoin(base, raw)
              parts = urllib.parse.urlsplit(absolute)
              host = (parts.hostname or "").lower()
              if parts.scheme not in {"http", "https"}:
                  return
              if not (
                  host.endswith(".fnnas.com")
                  or host.endswith(".fnos.net")
                  or host in {"fnos.net", "static2.fnnas.com"}
              ):
                  return
              if not (parts.path.endswith((".js", ".mjs", ".map")) or "/assets/" in parts.path):
                  return
              clean = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, parts.query, ""))
              if clean not in seen:
                  asset_urls.append(clean)

          def discover(base: str, text: str) -> None:
              patterns = [
                  r"(?:src|href)\s*=\s*[\"']([^\"']+)[\"']",
                  r"[\"']((?:https?:)?//[^\"']+\.(?:js|mjs|map)(?:\?[^\"']*)?)[\"']",
                  r"[\"']([^\"']+\.(?:js|mjs|map)(?:\?[^\"']*)?)[\"']",
                  r"sourceMappingURL=([^\s*]+)",
              ]
              for pattern in patterns:
                  for match in re.finditer(pattern, text, re.I):
                      enqueue(base, match.group(1))

          discover(final_entry, entry_text)
          while asset_urls and len(seen) < 120:
              url = asset_urls.popleft()
              if url in seen:
                  continue
              seen.add(url)
              try:
                  final_url, body, content_type = fetch(url)
                  if "javascript" not in content_type and not final_url.endswith((".js", ".mjs", ".map")):
                      continue
                  text = body.decode("utf-8", "ignore")
                  documents.append((final_url, text))
                  emit("ASSET", final_url, content_type, len(body))
                  discover(final_url, text)
              except Exception as error:
                  emit("ASSET_ERROR", url, type(error).__name__, str(error))

          target_terms = re.compile(
              r"delete|remove|unlink|trash|recycle|audioFileDeleted|isAudioFileDeleted|"
              r"trackGUIDs?|filePath|rmFile|remoteEntry|randomCode|genAccountUrl|genBridgeUrl|"
              r"fnconnect|relay|/api/v\d+/fn|/music/api/v\d+|music(?:/|\\/)",
              re.I,
          )
          literal_pattern = re.compile(r"(?P<q>[\"'`])(?P<body>(?:\\.|(?!\1).){1,1200})(?P=q)", re.S)
          route_pattern = re.compile(
              r"/(?:music/)?api/v\d+/(?:[A-Za-z0-9_.{}$-]+/)*[A-Za-z0-9_.{}$-]+|"
              r"/(?:track|file|files|audio|library|scan|folder|recycle|trash)(?:/[A-Za-z0-9_.{}$~-]+)+",
              re.I,
          )
          url_pattern = re.compile(r"https?://[^\"'`\s<>]+", re.I)

          literals: set[str] = set()
          routes: set[str] = set()
          urls: set[str] = set()
          contexts: set[str] = set()

          for source_url, text in documents:
              routes.update(match.group(0) for match in route_pattern.finditer(text))
              urls.update(match.group(0) for match in url_pattern.finditer(text))
              for match in literal_pattern.finditer(text):
                  value = match.group("body")
                  if target_terms.search(value):
                      literals.add(value[:1200])
              for match in target_terms.finditer(text):
                  start = max(0, match.start() - 650)
                  end = min(len(text), match.end() + 1050)
                  snippet = re.sub(r"\s+", " ", text[start:end]).strip()
                  if snippet:
                      contexts.add(f"SOURCE {source_url}\n{snippet[:1800]}")

          emit("\n=== MATCHING STRING LITERALS ===")
          for value in sorted(literals, key=str.lower):
              emit(value)
          emit("\n=== ROUTE CANDIDATES ===")
          for route in sorted(routes, key=str.lower):
              emit(route)
          emit("\n=== URL CANDIDATES ===")
          for url in sorted(urls, key=str.lower):
              if target_terms.search(url) or any(token in url.lower() for token in ("api", "remote", "connect", "music")):
                  emit(url)
          emit("\n=== TARGETED CONTEXTS ===")
          for snippet in sorted(contexts)[:1200]:
              emit(snippet)
          emit(
              "\nSUMMARY",
              json.dumps(
                  {
                      "documents": len(documents),
                      "assets": len(seen),
                      "literals": len(literals),
                      "routes": len(routes),
                      "urls": len(urls),
                      "contexts": len(contexts),
                  },
                  ensure_ascii=False,
              ),
          )
          RESULT.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add probe-results/fnos-delete-api-probe.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(probe): capture FN Connect route and delete API clues [skip ci]'
            git push origin HEAD:chore/probe-fnos-delete-api
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: fnos-delete-api-probe
          path: probe-results/fnos-delete-api-probe.txt
          if-no-files-found: error
          retention-days: 7
