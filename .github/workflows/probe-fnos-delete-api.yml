name: Probe FNOS music delete API

on:
  push:
    branches:
      - chore/probe-fnos-delete-api

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public FNOS Music frontend routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import ssl
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import deque

          START_URLS = [
              "https://pkxutao.fnos.net/music/",
              "https://pkxutao.fnos.net/music",
          ]
          context = ssl.create_default_context()
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE
          opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=context),
              urllib.request.HTTPRedirectHandler(),
          )

          def fetch(url: str) -> tuple[str, bytes, str]:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 XT-Music-CI-ReadOnly-Probe/1.0",
                      "Accept": "text/html,application/javascript,text/javascript,*/*;q=0.8",
                  },
              )
              with opener.open(request, timeout=25) as response:
                  body = response.read(25 * 1024 * 1024)
                  return response.geturl(), body, response.headers.get("content-type", "")

          html_url = None
          html = b""
          for candidate in START_URLS:
              try:
                  final_url, body, content_type = fetch(candidate)
                  print(f"ENTRY {candidate} -> {final_url} ({content_type}, {len(body)} bytes)")
                  html_url, html = final_url, body
                  break
              except Exception as error:
                  print(f"ENTRY_ERROR {candidate}: {type(error).__name__}: {error}")
          if html_url is None:
              raise SystemExit("Unable to fetch FNOS Music public frontend")

          origin = urllib.parse.urlsplit(html_url)
          allowed_origin = (origin.scheme, origin.netloc)
          queue: deque[str] = deque()
          seen: set[str] = set()
          documents: list[tuple[str, str]] = []

          def enqueue(base: str, raw: str) -> None:
              raw = raw.strip().strip('"\'')
              if not raw or raw.startswith(("data:", "blob:", "javascript:")):
                  return
              absolute = urllib.parse.urljoin(base, raw)
              parts = urllib.parse.urlsplit(absolute)
              if (parts.scheme, parts.netloc) != allowed_origin:
                  return
              clean = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, parts.query, ""))
              if clean not in seen and clean.lower().split("?", 1)[0].endswith((".js", ".mjs", ".map")):
                  queue.append(clean)

          html_text = html.decode("utf-8", "ignore")
          documents.append((html_url, html_text))
          for match in re.finditer(r"(?:src|href)\s*=\s*[\"']([^\"']+)[\"']", html_text, re.I):
              enqueue(html_url, match.group(1))
          for match in re.finditer(r"[\"']([^\"']+\.(?:js|mjs|map)(?:\?[^\"']*)?)[\"']", html_text, re.I):
              enqueue(html_url, match.group(1))

          while queue and len(seen) < 120:
              url = queue.popleft()
              if url in seen:
                  continue
              seen.add(url)
              try:
                  final_url, body, content_type = fetch(url)
                  text = body.decode("utf-8", "ignore")
                  documents.append((final_url, text))
                  print(f"ASSET {final_url} ({content_type}, {len(body)} bytes)")
                  for match in re.finditer(r"[\"']([^\"']+\.(?:js|mjs|map)(?:\?[^\"']*)?)[\"']", text, re.I):
                      enqueue(final_url, match.group(1))
                  for match in re.finditer(r"sourceMappingURL=([^\s*]+)", text, re.I):
                      enqueue(final_url, match.group(1))
              except Exception as error:
                  print(f"ASSET_ERROR {url}: {type(error).__name__}: {error}")

          route_patterns = [
              re.compile(r"/(?:music/api/v1/)?(?:track|file|audio|library|scan|folder|recycle|trash)(?:/[A-Za-z0-9_.~-]+)+", re.I),
              re.compile(r"/(?:favorite-track|play-history|playlist)(?:/[A-Za-z0-9_.~-]+)+", re.I),
          ]
          routes: set[str] = set()
          contexts: set[str] = set()
          keyword = re.compile(r"delete|remove|trash|recycle|unlink|audioFileDeleted|isAudioFileDeleted|filePath|trackGUIDs?", re.I)
          for url, text in documents:
              for pattern in route_patterns:
                  routes.update(match.group(0) for match in pattern.finditer(text))
              for match in keyword.finditer(text):
                  start = max(0, match.start() - 180)
                  end = min(len(text), match.end() + 260)
                  snippet = re.sub(r"\s+", " ", text[start:end])
                  if any(token in snippet.lower() for token in ("/track/", "/file/", "audiofile", "trackguid")):
                      contexts.add(snippet[:500])

          print("\n=== ROUTES ===")
          for route in sorted(routes, key=str.lower):
              print(route)
          print("\n=== DELETE-RELATED CONTEXTS ===")
          for snippet in sorted(contexts)[:200]:
              print(snippet)
          print(f"\nSUMMARY documents={len(documents)} assets={len(seen)} routes={len(routes)} contexts={len(contexts)}")
          PY
