name: Probe FNOS music delete API

on:
  push:
    branches:
      - chore/probe-fnos-delete-api

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect public FNOS Music frontend routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import re
          import ssl
          import urllib.parse
          import urllib.request
          from collections import deque

          START_URLS = [
              "https://pkxutao.fnos.net/music/",
              "https://pkxutao.fnos.net/music",
              "https://pkxutao.fnos.net/music/api/v1/track/list?page=1&size=1",
          ]
          context = ssl.create_default_context()
          context.check_hostname = False
          context.verify_mode = ssl.CERT_NONE
          opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=context),
              urllib.request.HTTPRedirectHandler(),
          )

          def fetch(url: str) -> tuple[str, bytes, str, dict[str, str]]:
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 XT-Music-CI-ReadOnly-Probe/3.0",
                      "Accept": "text/html,application/javascript,text/javascript,application/json,*/*;q=0.8",
                  },
              )
              with opener.open(request, timeout=25) as response:
                  body = response.read(30 * 1024 * 1024)
                  headers = {str(k).lower(): str(v) for k, v in response.headers.items()}
                  return response.geturl(), body, response.headers.get("content-type", ""), headers

          documents: list[tuple[str, str]] = []
          allowed_hosts = {
              "pkxutao.fnos.net",
              "fnos.net",
              "www.fnos.net",
              "static2.fnnas.com",
          }

          for candidate in START_URLS:
              try:
                  final_url, body, content_type, headers = fetch(candidate)
                  text = body.decode("utf-8", "ignore")
                  print(f"ENTRY {candidate} -> {final_url} ({content_type}, {len(body)} bytes)")
                  print("ENTRY_HEADERS", {k: headers[k] for k in sorted(headers) if k in {"content-type", "location", "server", "set-cookie", "x-powered-by"}})
                  print("=== ENTRY BODY START ===")
                  print(text[:12000])
                  print("=== ENTRY BODY END ===")
                  documents.append((final_url, text))
                  host = urllib.parse.urlsplit(final_url).hostname
                  if host:
                      allowed_hosts.add(host.lower())
              except Exception as error:
                  print(f"ENTRY_ERROR {candidate}: {type(error).__name__}: {error}")

          queue: deque[str] = deque()
          seen: set[str] = set()

          def enqueue(base: str, raw: str) -> None:
              raw = html.unescape(raw.strip().strip('"\''))
              if not raw or raw.startswith(("data:", "blob:", "javascript:", "mailto:")):
                  return
              absolute = urllib.parse.urljoin(base, raw)
              parts = urllib.parse.urlsplit(absolute)
              host = (parts.hostname or "").lower()
              if parts.scheme not in {"http", "https"}:
                  return
              if (
                  host not in allowed_hosts
                  and not host.endswith(".fnos.net")
                  and not host.endswith(".fnnas.com")
              ):
                  return
              clean = urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, parts.query, ""))
              if clean not in seen:
                  queue.append(clean)

          def discover(base: str, text: str) -> None:
              patterns = [
                  r"(?:src|href|action)\s*=\s*[\"']([^\"']+)[\"']",
                  r"(?:url|location|location\.href|window\.location)\s*[:=]\s*[\"']([^\"']+)[\"']",
                  r"content\s*=\s*[\"'][^\"']*url=([^\"';]+)",
                  r"[\"']((?:https?:)?//[^\"']+)[\"']",
                  r"[\"']([^\"']+\.(?:js|mjs|map)(?:\?[^\"']*)?)[\"']",
              ]
              for pattern in patterns:
                  for match in re.finditer(pattern, text, re.I):
                      enqueue(base, match.group(1))
              for match in re.finditer(r"sourceMappingURL=([^\s*]+)", text, re.I):
                  enqueue(base, match.group(1))

          for base, text in list(documents):
              discover(base, text)

          while queue and len(seen) < 260:
              url = queue.popleft()
              if url in seen:
                  continue
              seen.add(url)
              try:
                  final_url, body, content_type, headers = fetch(url)
                  text = body.decode("utf-8", "ignore")
                  documents.append((final_url, text))
                  print(f"ASSET {url} -> {final_url} ({content_type}, {len(body)} bytes)")
                  discover(final_url, text)
              except Exception as error:
                  print(f"ASSET_ERROR {url}: {type(error).__name__}: {error}")

          route_patterns = [
              re.compile(r"/(?:music/api/v1/)?(?:track|file|audio|library|scan|folder|recycle|trash)(?:/[A-Za-z0-9_.~-]+)+", re.I),
              re.compile(r"/(?:favorite-track|play-history|playlist)(?:/[A-Za-z0-9_.~-]+)+", re.I),
              re.compile(r"/(?:api/v[0-9]+/)?(?:file|files|entry|entries)(?:/[A-Za-z0-9_.~-]+)+", re.I),
          ]
          routes: set[str] = set()
          contexts: set[str] = set()
          keyword = re.compile(r"delete|remove|trash|recycle|unlink|audioFileDeleted|isAudioFileDeleted|filePath|trackGUIDs?|rmFile|websocket|wss:|relay", re.I)
          for url, text in documents:
              for pattern in route_patterns:
                  routes.update(match.group(0) for match in pattern.finditer(text))
              for match in keyword.finditer(text):
                  start = max(0, match.start() - 260)
                  end = min(len(text), match.end() + 460)
                  snippet = re.sub(r"\s+", " ", text[start:end])
                  if any(token in snippet.lower() for token in ("/track/", "/file/", "audiofile", "trackguid", "recycle", "unlink", "delete", "websocket", "relay")):
                      contexts.add(snippet[:760])

          print("\n=== DISCOVERED URLS ===")
          for url in sorted(seen):
              print(url)
          print("\n=== ROUTES ===")
          for route in sorted(routes, key=str.lower):
              print(route)
          print("\n=== DELETE / RELAY CONTEXTS ===")
          for snippet in sorted(contexts)[:400]:
              print(snippet)
          print(f"\nSUMMARY documents={len(documents)} fetched={len(seen)} routes={len(routes)} contexts={len(contexts)}")
          PY
