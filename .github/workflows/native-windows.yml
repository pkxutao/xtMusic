name: Native Windows

on:
  push:
    branches:
      - feat/native-rust-egui-0.3.0
      - publish/native-v0.3.0
    paths:
      - 'native/**'
      - 'packaging/windows/native-installer.nsi'
      - '.github/workflows/native-windows.yml'
  pull_request:
    branches: [master]
    paths:
      - 'native/**'
      - 'packaging/windows/native-installer.nsi'
      - '.github/workflows/native-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          shared-key: xtmusic-pure-native-windows

      - name: Prove native architecture
        shell: pwsh
        run: |
          if (Select-String -Path native/Cargo.toml -Pattern 'tauri|wry|webview|electron' -Quiet) { throw 'Web runtime dependency detected' }

      - name: Format, test and lint
        shell: pwsh
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          cargo test --manifest-path native/Cargo.toml
          cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --manifest-path native/Cargo.toml --release

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item native/target/release/xtmusic.exe release/XT-Music-Native-0.3.0-Windows-x64.exe
          Compress-Archive -Path native/target/release/xtmusic.exe -DestinationPath release/XT-Music-Native-0.3.0-Windows-x64-Portable.zip -Force
          & "$env:ProgramFiles(x86)\NSIS\makensis.exe" /DVERSION=0.3.0 /DBINARY="$pwd\native\target\release\xtmusic.exe" packaging/windows/native-installer.nsi
          Get-FileHash release/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release/SHA256SUMS-Native-Windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Native-Windows-0.3.0
          path: release/*
          if-no-files-found: error
          retention-days: 14
