name: Native Source Fixup

on:
  push:
    branches:
      - feat/native-rust-egui-0.3.0
    paths:
      - "native/.source-fixups/**"
      - ".github/workflows/native-source-fixup.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-rust-egui-0.3.0
      - name: Apply deterministic source fixes
        shell: python
        run: |
          from pathlib import Path
          path = Path("native/src/app.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'ui.selectable_value(&mut self.shuffle, !self.shuffle, "随机");',
              'if ui.selectable_label(self.shuffle, "随机").clicked() { self.shuffle = !self.shuffle; }'
          )
          for radius in (8, 9, 10, 14):
              text = text.replace(
                  f'.corner_radius({radius}.0)',
                  f'.corner_radius(egui::CornerRadius::same({radius}))'
              )
          path.write_text(text, encoding="utf-8")
      - name: Commit normalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/app.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(native): normalize egui compatibility"
          git push origin HEAD:feat/native-rust-egui-0.3.0
