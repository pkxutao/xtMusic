name: Native Windows Build

on:
  push:
    branches: [master, main]
    paths:
      - "native/**"
      - ".github/workflows/native-windows-build.yml"
  pull_request:
    branches: [master]
    paths:
      - "native/**"
      - ".github/workflows/native-windows-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Rust formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --manifest-path native/Cargo.toml

      - name: Build release binary
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "native\installer\windows.iss"

      - name: Generate checksums
        shell: powershell
        run: |
          Get-FileHash native\dist\*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content native\dist\SHA256SUMS-Windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Native-Windows-x64
          path: |
            native/dist/*.exe
            native/dist/SHA256SUMS-Windows.txt
          if-no-files-found: error
