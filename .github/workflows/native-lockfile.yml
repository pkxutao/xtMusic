name: Native Lockfile

on:
  push:
    branches:
      - feat/native-rust-egui-0.3.0
    paths:
      - "native/Cargo.toml"
      - "native/src/**"
      - ".github/workflows/native-lockfile.yml"

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-rust-egui-0.3.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libssl-dev fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo generate-lockfile --manifest-path native/Cargo.toml
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path native/Cargo.toml
      - name: Commit Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(native): lock Rust dependencies"
          git push origin HEAD:feat/native-rust-egui-0.3.0
