name: Native Lockfile

on:
  push:
    branches:
      - feat/native-rust-egui-0.3.0
    paths:
      - "native/Cargo.toml"
      - ".github/workflows/native-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-rust-egui-0.3.0
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libasound2-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libssl-dev fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Generate deterministic dependency lock
        run: |
          cargo generate-lockfile --manifest-path native/Cargo.toml
          cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Commit Cargo.lock before compilation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "build(native): lock Rust dependencies"
            git push origin HEAD:feat/native-rust-egui-0.3.0
          fi
      - name: Compile and test locked graph
        run: |
          cargo check --locked --manifest-path native/Cargo.toml
          cargo test --locked --manifest-path native/Cargo.toml
