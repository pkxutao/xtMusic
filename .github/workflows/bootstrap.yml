name: Bootstrap repository

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified master data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Restore and publish XT Music source
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          encoded="$work/xtmusic.b64"
          archive="$work/xtmusic.tar.gz"

          {
            cat bootstrap/chunk-000
            cat bootstrap/chunk-001
            cat bootstrap/chunk-002
            cat bootstrap/repair/003-00
            cat bootstrap/repair/003-01
            cat bootstrap/repair/003-02
            cat bootstrap/repair/003-03
            cat bootstrap/repair/003-04
            cat bootstrap/repair/003-05
            cat bootstrap/repair/003-06
            cat bootstrap/repair/004-00
            cat bootstrap/repair/004-01
            cat bootstrap/repair/004-02
            cat bootstrap/repair/004-03
            cat bootstrap/repair/004-04
            cat bootstrap/repair/004-05
            cat bootstrap/repair/004-06
            cat bootstrap/repair/005-00
            cat bootstrap/repair/005-01
            cat bootstrap/repair/005-02
            cat bootstrap/repair/005-03
            cat bootstrap/repair/005-04
            cat bootstrap/repair/005-05
            cat bootstrap/repair/005-06
            cat bootstrap/chunk-006
            cat bootstrap/chunk-007
          } > "$encoded"

          test "$(wc -c < "$encoded")" = "140364"
          echo "23b2d3a67d4a1dda134d01c267de86de7c9862ac95a56eae7d1414a5a2bc7410  $encoded" | sha256sum --check --strict
          test "$(git hash-object "$encoded")" = "08ea849e0dd6d1f23247eda98eb5f946560aeba8"

          base64 --decode "$encoded" > "$archive"
          echo "d6edea75451eb24c94c31b5d2d05acccd5715beaba9f5d8a592440ed54513e8e  $archive" | sha256sum --check --strict

          mkdir "$work/source"
          tar -xzf "$archive" -C "$work/source"
          test -f "$work/source/package.json"
          test -f "$work/source/README.md"
          test -f "$work/source/src/main/protocol/feiniu-client.js"

          # The GitHub Actions token cannot add workflow files. Preserve this
          # bootstrap workflow, publish all application source first, then the
          # connected GitHub app writes the two final CI workflows separately.
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$work/source/" "$GITHUB_WORKSPACE/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initialize XT Music Windows client"
          git push origin HEAD:master
          git push origin HEAD:main
