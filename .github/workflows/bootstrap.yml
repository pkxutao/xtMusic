name: Bootstrap repository

on:
  push:
    paths:
      - bootstrap/READY

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and publish XT Music source
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          cat bootstrap/chunk-* | base64 --decode > "$work/xtmusic.tar.gz"
          echo "d6edea75451eb24c94c31b5d2d05acccd5715beaba9f5d8a592440ed54513e8e  $work/xtmusic.tar.gz" | sha256sum --check --strict

          mkdir "$work/source"
          tar -xzf "$work/xtmusic.tar.gz" -C "$work/source"
          test -f "$work/source/package.json"
          test -f "$work/source/README.md"
          test -f "$work/source/src/main/protocol/feiniu-client.js"

          rsync -a --delete --exclude='.git/' "$work/source/" "$GITHUB_WORKSPACE/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initialize XT Music Windows client"
          git push origin HEAD:master
          git push origin HEAD:main
