name: Android Turntable - Test, Package and Release

on:
  push:
    branches: [master, feat/android-turntable-20260905]
    paths: ['android/**', '.github/workflows/android-turntable.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-turntable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact committed source (no generated files or credentials)
        run: |
          mkdir -p source-artifact
          git archive --format=zip HEAD -o source-artifact/xtMusic-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Turntable-Source
          path: source-artifact/xtMusic-source.zip
          retention-days: 14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests, lint and universal debug APK
        run: gradle -p android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Build instrumentation tests
        if: hashFiles('android/app/src/androidTest/**') != ''
        run: gradle -p android --no-daemon assembleDebugAndroidTest
      - name: Enable hardware acceleration for the Android emulator
        if: hashFiles('android/app/src/androidTest/**') != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device UI regression - Android 15
        if: hashFiles('android/app/src/androidTest/**') != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          script: |
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 1
            gradle -p android --no-daemon connectedDebugAndroidTest
            mkdir -p artifact/screenshots
            adb pull /sdcard/Android/data/com.pkxutao.xtmusic.android.debug/files/turntable-screenshots/. artifact/screenshots/
      - name: Verify and describe the APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          APK="XT-Music-Android-${VERSION}-Turntable-universal-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifact/$APK"
          unzip -t "artifact/$APK" > artifact/APK-ZIP-CHECK.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "artifact/$APK" > artifact/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "artifact/$APK" > artifact/APK-BADGING.txt
          (cd artifact && sha256sum "$APK" > SHA256SUMS.txt)
          printf 'Version: %s\nCommit: %s\nWorkflow: %s/%s/actions/runs/%s\nVariant: debug; Android debug certificate, not a production release signing key\n' "$VERSION" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifact/BUILD-INFO.txt
          if [ -f android/TURNTABLE-PLAYER.md ]; then cp android/TURNTABLE-PLAYER.md artifact/RELEASE-NOTES.md; fi
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Turntable-Test-Reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Turntable-APK
          path: artifact/
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Android-Turntable-APK
          path: artifact
      - name: Publish a new Android prerelease without changing desktop releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/java/com/pkxutao/xtmusic/android/TurntableView.kt
          test -f artifact/RELEASE-NOTES.md
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]
          TAG="android-v${VERSION}"
          (cd artifact && sha256sum -c SHA256SUMS.txt)
          # Never overwrite an older tag or a previously published installer.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it. Bump the Android version for a new release."
            exit 1
          fi
          gh release create "$TAG" artifact/*.apk artifact/*.txt artifact/RELEASE-NOTES.md \
            --target "$GITHUB_SHA" --title "XT Music Android ${VERSION} · 留声机播放页" \
            --notes-file artifact/RELEASE-NOTES.md --prerelease --latest=false
          gh release view "$TAG" --json tagName,url,assets
