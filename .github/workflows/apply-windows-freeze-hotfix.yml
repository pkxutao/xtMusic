name: Apply Windows Login Freeze Hotfix 0.3.3

on:
  push:
    branches:
      - fix/windows-login-freeze-0.3.3
    paths:
      - '.github/workflows/apply-windows-freeze-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xtmusic-windows-freeze-hotfix-0.3.3
  cancel-in-progress: false

jobs:
  apply-test-package:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply source hotfix
        run: node scripts/apply-windows-freeze-hotfix.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run application and performance tests
        run: npm run build

      - name: Verify renderer assets
        run: node scripts/verify-renderer-assets.js

      - name: Capture Windows UI proof
        run: npx electron scripts/windows-ui-snapshot.js

      - name: Exercise loopback playback
        run: npx electron scripts/windows-media-smoke.js

      - name: Exercise delayed login, 5000 playlists and 2000-song queue
        run: npx electron scripts/windows-post-login-smoke.js

      - name: Build Windows installer and portable package
        run: npm run dist:win

      - name: Verify packages and generate checksums
        shell: pwsh
        run: |
          $installer = Get-Item 'release/XT-Music-0.3.3-x64.exe'
          $portable = Get-Item 'release/XT-Music-Portable-0.3.3-x64.exe'
          if ($installer.Length -lt 50000000) { throw "Installer is unexpectedly small: $($installer.Length)" }
          if ($portable.Length -lt 50000000) { throw "Portable package is unexpectedly small: $($portable.Length)" }
          if (-not (Test-Path 'ui-proof/windows-post-login-smoke.json')) { throw 'Missing post-login smoke proof' }
          Get-FileHash $installer.FullName, $portable.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content 'release/SHA256SUMS-Windows.txt'
          Get-Content 'release/SHA256SUMS-Windows.txt'
          Get-Content 'ui-proof/windows-post-login-smoke.json'

      - id: commit
        name: Commit validated source hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add package.json src tests scripts releases
          git status --short
          git commit -m 'fix: prevent Windows post-login renderer freeze'
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:fix/windows-login-freeze-0.3.3

      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Windows-Responsiveness-0.3.3
          path: |
            release/XT-Music-0.3.3-x64.exe
            release/XT-Music-Portable-0.3.3-x64.exe
            release/SHA256SUMS-Windows.txt
            ui-proof/renderer-assets.json
            ui-proof/windows-ui-metrics.json
            ui-proof/windows-ui-snapshot.png
            ui-proof/windows-media-smoke.json
            ui-proof/windows-post-login-smoke.json
          if-no-files-found: error
          retention-days: 30
