name: Ubuntu Native Build

on:
  push:
    branches:
      - feat/native-rust-egui-0.3.0
  pull_request:
    branches:
      - master
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'native-src/**'
      - 'packaging/linux/**'
      - '.github/workflows/ubuntu-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev pkg-config libssl-dev desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtmusic-native-ubuntu

      - name: Verify source is native
        run: |
          test ! -d src-tauri
          ! grep -Eiq 'tauri|wry|webview' Cargo.toml

      - name: Format and test
        run: |
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package DEB and AppImage
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.3.0
          mkdir -p release
          strip target/release/xtmusic

          DEBROOT=release/debroot
          mkdir -p "$DEBROOT/DEBIAN" "$DEBROOT/usr/bin" \
            "$DEBROOT/usr/share/applications" \
            "$DEBROOT/usr/share/icons/hicolor/256x256/apps"
          install -m 0755 target/release/xtmusic "$DEBROOT/usr/bin/xtmusic"
          install -m 0644 packaging/linux/xtmusic-native.desktop "$DEBROOT/usr/share/applications/xtmusic-native.desktop"
          install -m 0644 assets/app-icon.png "$DEBROOT/usr/share/icons/hicolor/256x256/apps/xtmusic-native.png"
          cat > "$DEBROOT/DEBIAN/control" <<EOF
          Package: xtmusic-native
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: pkxutao
          Depends: libasound2, libx11-6, libxi6, libxcursor1, libxrandr2, libxinerama1, libwayland-client0, libgl1
          Description: Native Rust desktop client for FNOS Music
           Pure native GPU application using eframe/egui and rodio. No Electron, Tauri or WebView.
          EOF
          dpkg-deb --root-owner-group --build "$DEBROOT" "release/XT-Music-Native-${VERSION}-Ubuntu-amd64.deb"

          APPDIR=release/XTMusicNative.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          install -m 0755 target/release/xtmusic "$APPDIR/usr/bin/xtmusic"
          install -m 0644 packaging/linux/xtmusic-native.desktop "$APPDIR/xtmusic-native.desktop"
          install -m 0644 packaging/linux/xtmusic-native.desktop "$APPDIR/usr/share/applications/xtmusic-native.desktop"
          install -m 0644 assets/app-icon.png "$APPDIR/xtmusic-native.png"
          install -m 0644 assets/app-icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/xtmusic-native.png"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/xtmusic" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o release/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x release/appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 release/appimagetool.AppImage \
            "$APPDIR" "release/XT-Music-Native-${VERSION}-Ubuntu-x86_64.AppImage"
          rm -rf "$DEBROOT" "$APPDIR" release/appimagetool.AppImage
          (cd release && sha256sum XT-Music-Native-* > SHA256SUMS-Ubuntu.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: XT-Music-Native-Ubuntu-0.3.0
          path: |
            release/XT-Music-Native-*.deb
            release/XT-Music-Native-*.AppImage
            release/SHA256SUMS-Ubuntu.txt
          if-no-files-found: error
          retention-days: 14
