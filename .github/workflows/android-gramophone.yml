name: Android Gramophone Build and Release

on:
  push:
    branches:
      - feat/android-gramophone-20260905
      - master
    paths:
      - 'android/**'
      - '.github/workflows/android-gramophone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-gramophone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Archive exact source
        run: |
          mkdir -p artifact
          git archive --format=zip -o artifact/android-source.zip HEAD android .github/workflows/android-gramophone.yml
      - name: Unit tests, lint and APKs
        run: gradle -p android --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Device UI tests, normal and small-screen large-font layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global animator_duration_scale 1
            gradle -p android --no-daemon connectedDebugAndroidTest
            mkdir -p artifact/ui-normal
            cp -r android/app/build/reports/androidTests/connected artifact/ui-normal/reports
            adb shell wm size 720x1280
            adb shell wm density 360
            adb shell settings put system font_scale 1.3
            gradle -p android --no-daemon connectedDebugAndroidTest
            mkdir -p artifact/ui-small
            cp -r android/app/build/reports/androidTests/connected artifact/ui-small/reports
            adb pull /data/local/tmp/xtmusic-gramophone-proof artifact/screenshots
            adb shell wm size reset
            adb shell wm density reset
            adb shell settings put system font_scale 1.0
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          APK=XT-Music-Android-0.1.0-alpha04-Gramophone-universal-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifact/$APK"
          unzip -t "artifact/$APK" > artifact/APK-ZIP-VERIFICATION.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "artifact/$APK" > artifact/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "artifact/$APK" > artifact/APK-BADGING.txt
          (cd artifact && sha256sum "$APK" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          cat > artifact/BUILD-INFO.txt <<INFO
          XT Music Android 0.1.0-alpha04 - Gramophone
          Source commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Package: com.pkxutao.xtmusic.android.debug
          Version code: 4
          Minimum SDK: 26; target SDK: 35
          Native Kotlin platform Views and Canvas; no WebView
          Signing: debug test build, NOT production release signing
          Unit tests, Android Lint, emulator UI tests: completed successfully
          Emulator profiles: normal portrait; 320dp-width with 1.3 font scale
          UI tests use synthetic playback state; no real server or audio-device validation
          INFO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XT-Music-Android-Gramophone-${{ github.sha }}
          path: |
            artifact/**
            android/app/build/reports/**
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: XT-Music-Android-Gramophone-${{ github.sha }}
          path: release-artifact
      - name: Publish validated Android pre-release without replacing desktop assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=android-v0.1.0-alpha04
          APK=$(find release-artifact -name 'XT-Music-Android-0.1.0-alpha04-Gramophone-universal-debug.apk' -print -quit)
          test -n "$APK"
          DIR=$(dirname "$APK")
          (cd "$DIR" && sha256sum -c SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite an existing release."
            exit 1
          fi
          gh release create "$TAG" "$APK" "$DIR/SHA256SUMS.txt" "$DIR/BUILD-INFO.txt" \
            "$DIR/APK-SIGNATURE.txt" "$DIR/APK-BADGING.txt" "$DIR/APK-ZIP-VERIFICATION.txt" \
            --target "$GITHUB_SHA" --title 'XT Music Android 0.1.0-alpha04 · 留声机播放页' \
            --notes-file android/GRAMOPHONE.md --prerelease --draft
          gh release edit "$TAG" --draft=false --latest=false
