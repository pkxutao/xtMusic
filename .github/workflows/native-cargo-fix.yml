name: Native Cargo Fix

on:
  push:
    branches:
      - feat/native-rust-egui-0.3.0
    paths:
      - "native/Cargo.toml"
      - "native/src/**"
      - "native/tests/**"
      - ".github/workflows/native-cargo-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/native-rust-egui-0.3.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          components: rustfmt
      - name: Format native Rust source
        run: cargo fmt --manifest-path native/Cargo.toml
      - name: Verify formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - name: Commit formatted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src native/tests
          if git diff --cached --quiet; then
            echo "Rust source is already formatted."
            exit 0
          fi
          git commit -m "style(native): format Rust source"
          git push origin HEAD:feat/native-rust-egui-0.3.0
