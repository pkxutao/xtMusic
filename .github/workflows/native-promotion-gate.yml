name: Native Promotion Gate

on:
  workflow_run:
    workflows:
      - Native Windows
      - Native Ubuntu
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: xtmusic-native-promotion-v0.3.0
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.head_branch == 'feat/native-rust-egui-0.3.0' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Require both native builds, merge and dispatch release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feat/native-rust-egui-0.3.0';

            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'v0.3.0' });
              releaseExists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (releaseExists) {
              core.info('v0.3.0 already exists; promotion is complete.');
              return;
            }

            const branchRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            const headSha = branchRef.data.object.sha;

            async function latestRun(workflowId) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowId,
                branch,
                per_page: 30,
              });
              return response.data.workflow_runs.find(run =>
                run.head_sha === headSha && run.event !== 'workflow_run'
              );
            }

            const windows = await latestRun('native-windows.yml');
            const ubuntu = await latestRun('native-ubuntu.yml');
            for (const [name, run] of [['Windows', windows], ['Ubuntu', ubuntu]]) {
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                core.info(`${name} is not successful for ${headSha}; waiting.`);
                return;
              }
            }

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'master',
              head: `${owner}:${branch}`,
              per_page: 10,
            });
            const pr = pulls.data[0];
            if (!pr) throw new Error(`No open pull request for ${branch}`);
            if (pr.head.sha !== headSha) throw new Error('Pull request head changed during promotion');

            const merged = await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              sha: headSha,
              merge_method: 'merge',
              commit_title: 'feat: release XT Music 0.3.0 native Rust client',
              commit_message: 'Merge the pure native egui/rodio client after successful Windows and Ubuntu builds.',
            });
            if (!merged.data.merged) throw new Error(merged.data.message || 'Pull request merge failed');

            const masterRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/master' });
            const mergeSha = masterRef.data.object.sha;
            try {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: 'heads/main',
                sha: mergeSha,
                force: true,
              });
            } catch (error) {
              if (error.status === 422) {
                await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/main', sha: mergeSha });
              } else {
                throw error;
              }
            }

            try {
              await github.rest.pulls.createReviewComment;
            } catch (_) {}

            try {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: 11,
                body: '该 Tauri/WebView 迁移方案已由纯 Rust egui 原生实现取代，关闭此旧 PR。',
              });
              await github.rest.pulls.update({ owner, repo, pull_number: 11, state: 'closed' });
            } catch (error) {
              core.info(`Old PR cleanup skipped: ${error.message}`);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'native-release.yml',
              ref: 'master',
              inputs: { ref: mergeSha },
            });
            core.notice(`Native v0.3.0 release dispatched from ${mergeSha}`);
