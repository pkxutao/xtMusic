<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: blob: xtmusic:;
                 img-src 'self' data: blob: xtmusic: http://127.0.0.1:*;
                 media-src 'self' data: blob: xtmusic: http://127.0.0.1:*;
                 connect-src 'self' data: blob: xtmusic: http://127.0.0.1:*;
                 style-src 'self' 'unsafe-inline';
                 script-src 'self';
                 font-src 'self' data:;">
  <title>XT Music</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./platform.css">
  <link rel="stylesheet" href="./lyrics-experience.css">
  <link rel="stylesheet" href="./lyrics-line-mode.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-logo">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l11-2v13"></path>
        <circle cx="6" cy="18" r="3"></circle>
        <circle cx="17" cy="16" r="3"></circle>
      </svg>
    </div>
    <strong>XT Music</strong>
    <span>正在连接你的音乐库…</span>
    <div class="splash-progress"><i></i></div>
  </div>

  <div id="login-root" class="login-root is-hidden"></div>

  <div id="app-shell" class="app-shell is-hidden">
    <header class="titlebar">
      <div class="titlebar-drag-zone"></div>
      <div class="titlebar-nav">
        <button id="history-back" class="titlebar-button" aria-label="后退">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
        </button>
        <button id="history-forward" class="titlebar-button" aria-label="前进">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </div>
      <div class="global-search-wrap">
        <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input id="global-search" type="search" placeholder="搜索歌曲、专辑或歌手" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </div>
      <div class="titlebar-spacer"></div>
      <button id="titlebar-account" class="titlebar-account" aria-label="账号"></button>
      <div class="window-controls">
        <button id="window-minimize" class="window-control" aria-label="最小化">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6.5h10" stroke="currentColor"></path></svg>
        </button>
        <button id="window-maximize" class="window-control" aria-label="最大化">
          <svg id="maximize-icon" width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor"></rect></svg>
        </button>
        <button id="window-close" class="window-control close-control" aria-label="关闭">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="m2 2 8 8M10 2l-8 8" stroke="currentColor"></path></svg>
        </button>
      </div>
    </header>

    <div class="app-workspace">
      <div id="sidebar-root"></div>
      <main id="content-root" class="content-root"></main>
      <aside id="queue-panel" class="queue-panel"></aside>
    </div>

    <footer id="player-bar" class="player-bar">
      <div class="now-playing">
        <div id="player-cover" class="player-cover cover-placeholder" role="button" tabindex="-1" aria-label="打开正在播放和歌词" aria-disabled="true" title="播放歌曲后可打开歌词">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg>
        </div>
        <div class="now-playing-copy">
          <button id="player-title" class="now-playing-title" type="button" title="打开正在播放和歌词">选择一首歌曲</button>
          <div class="now-playing-meta">
            <button id="player-artist" class="now-playing-artist entity-link" type="button" disabled title="">XT Music</button>
            <span class="now-playing-separator" aria-hidden="true">·</span>
            <button id="player-album" class="now-playing-album" type="button" disabled title="">未知专辑</button>
          </div>
        </div>
        <button id="player-favorite" class="icon-button subtle" aria-label="收藏"></button>
      </div>

      <div class="player-center">
        <div class="transport-controls">
          <button id="player-shuffle" class="icon-button transport-secondary" aria-label="随机播放"></button>
          <button id="player-previous" class="icon-button transport-button" aria-label="上一首"></button>
          <button id="player-toggle" class="play-toggle" aria-label="播放"></button>
          <button id="player-next" class="icon-button transport-button" aria-label="下一首"></button>
          <button id="player-repeat" class="icon-button transport-secondary" aria-label="循环模式"></button>
        </div>
        <div class="progress-row">
          <span id="player-current-time">0:00</span>
          <input id="player-progress" class="range progress-range" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度">
          <span id="player-duration">0:00</span>
        </div>
      </div>

      <div class="player-tools">
        <button id="player-lyrics" class="icon-button subtle player-lyrics-button" aria-label="打开歌词" title="打开正在播放和歌词"></button>
        <button id="player-volume-icon" class="icon-button subtle" aria-label="静音"></button>
        <input id="player-volume" class="range volume-range" type="range" min="0" max="100" value="82" aria-label="音量">
        <button id="player-queue" class="icon-button subtle" aria-label="播放队列"></button>
      </div>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="context-menu-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="./diagnostics.js" defer></script>
  <script src="./platform.js" defer></script>
  <script src="./lyrics-experience.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
