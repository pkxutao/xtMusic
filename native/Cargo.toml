[workspace]
members = [
  "crates/xtmusic-core",
  "crates/xtmusic-app",
]
resolver = "2"

[workspace.package]
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["pkxutao"]
repository = "https://github.com/pkxutao/xtMusic"

[workspace.dependencies]
base64 = "0.22.1"
iced = { version = "0.14.0", features = ["tokio", "advanced-shaping"] }
md5 = "0.7.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["v4"] }
