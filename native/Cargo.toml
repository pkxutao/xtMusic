[package]
name = "xtmusic-native"
version = "0.3.0"
description = "Native high-performance FNOS Music desktop client"
authors = ["pkxutao"]
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[[bin]]
name = "xtmusic"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5.15"
directories = "6.0.0"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.32.3", features = ["image"] }
hex = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = "3.6.3"
md-5 = "0.10.6"
parking_lot = "0.12.5"
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "gzip", "brotli", "deflate"] }
rodio = { version = "0.20.1", features = ["symphonia-all"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
single-instance = "0.3.3"
thiserror = "2.0.17"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
